name: Build Android Link PMR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to apk/ folder
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p apk
          # Имя APK формируется из versionName в build.gradle: app-vX_Y.apk
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_SRC")
          cp "$APK_SRC" "apk/$APK_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "apk/$APK_NAME"
          if git diff --cached --quiet; then
            echo "APK не изменился, пропускаем commit"
            exit 0
          fi
          git commit -m "Publish $APK_NAME [skip ci]"
          git push origin main