name: Build Android Link PMR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Публикация APK в отдельную ветку apk (единственный автор — бот).
      # Так бот больше не коммитит в main и не блокирует push пользователя.
      - name: Publish APK to apk branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_SRC")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin apk:refs/remotes/origin/apk || echo "ветки apk ещё нет"
          rm -rf apk-wt
          if git rev-parse --verify origin/apk >/dev/null 2>&1; then
            git worktree add apk-wt origin/apk apk
          else
            git checkout --orphan apk
            git rm -rf --cached . >/dev/null 2>&1 || true
            git commit --allow-empty -m "init apk branch [skip ci]" -q
            git push origin apk
            git checkout main
            git worktree add apk-wt apk
          fi
          mkdir -p apk-wt/apk
          cp "$APK_SRC" "apk-wt/apk/$APK_NAME"
          printf '%s' "$APK_NAME" > apk-wt/apk/latest.txt
          git -C apk-wt add -A
          git -C apk-wt commit -m "Publish $APK_NAME [skip ci]" --allow-empty
          git -C apk-wt push origin HEAD:apk --force
          git worktree remove apk-wt --force